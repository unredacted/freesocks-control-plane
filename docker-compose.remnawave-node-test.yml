# Overlay on docker-compose.remnawave-test.yml: a REAL panel-managed node, a
# TLS 1.3 site for REALITY to borrow, and a pinned Xray CLIENT, so a test can
# open authenticated REALITY sessions through the node. This is what the
# panel-only stack cannot show: whether a node APPLIED a profile, how long that
# takes, and that a server name only works once the node runs the config that
# lists it (scripts/remnawave-node-integration.sh, docs/servers.md).
#
# Two networks on purpose: `rw-node-control` carries panel <-> node, and
# `rw-node-data` carries client <-> node <-> origin. Disconnecting the node from
# the control network holds it on its current config while clients still reach
# it, which is exactly the "panel updated, node did not" case.
#
# Nothing is published except the client's loopback test ports.
services:
  rw-test-backend:
    networks: [default, rw-node-control]

  rw-test-node:
    image: remnawave/node:3.4.1
    container_name: rw-test-node
    hostname: rw-test-node
    restart: 'no'
    environment:
      - NODE_PORT=2222
      # The panel's node key (GET /api/keygen), exported by the run script.
      - SECRET_KEY=${RW_TEST_NODE_SECRET:?set by scripts/remnawave-node-integration.sh}
    cap_add: [NET_ADMIN]
    networks: [rw-node-control, rw-node-data]

  # The site REALITY forwards unauthenticated handshakes to. Caddy's internal CA
  # issues a certificate for ANY name on demand, so every server name a test
  # lists is "really served" by the target, TLS 1.3, like a multi-tenant host.
  # :80 is the plain page a proxied request fetches through the tunnel.
  rw-test-origin:
    image: caddy:2-alpine
    container_name: rw-test-origin
    hostname: rw-test-origin
    restart: 'no'
    volumes:
      - ./docker/remnawave-node-test/origin.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [rw-node-data]

  # The CLIENT is the Xray binary of the node image itself: the exact core the
  # fleet runs, so a session failing here is a contract finding and never a
  # client/server version skew. Its config is written by the test: one
  # dokodemo-door inbound per server name under test, each through its own
  # REALITY outbound, so a plain HTTP fetch of a loopback port IS an
  # authenticated session with that name.
  rw-test-client:
    image: remnawave/node:3.4.1
    container_name: rw-test-client
    restart: 'no'
    profiles: [client]
    entrypoint: [/usr/local/bin/xray]
    volumes:
      - ./.cache/remnawave-node-test:/work:ro
    command: [run, -c, /work/client.json]
    ports:
      - '127.0.0.1:18100-18107:18100-18107'
    networks: [rw-node-data]

networks:
  rw-node-control:
  # NOT a private range, on purpose: current Xray refuses to proxy to private
  # addresses ("blocked target ... blackholing connection"), so a target on a
  # default Docker subnet is unreachable THROUGH the tunnel even though the
  # REALITY handshake succeeds. This bridge is local to the test host and routes
  # nowhere; the range only has to look public to the node's Xray.
  rw-node-data:
    ipam:
      config:
        - subnet: 11.11.11.0/24
