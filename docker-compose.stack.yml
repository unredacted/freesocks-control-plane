# Beta deployment: self-hosted Convex backend (internal) + Caddy serving the SPA
# and reverse-proxying the API. Standalone (not an overlay on docker-compose.yml,
# which is the dev stack). Run from the repo root on the beta host:
#
#   docker compose -f docker-compose.beta.yml --env-file .env.beta up -d --build
#
# Caddy reaches the backend's HTTP-actions port (:3211) over the compose network;
# it is NOT published. The deploy/sync API (:3210) + dashboard (:6791) bind to
# 127.0.0.1 only (on-host `convex deploy` + an SSH-tunnelled dashboard); never
# expose them publicly. Full runbook: docs/beta-deploy.md.
name: ${COMPOSE_PROJECT_NAME:-fcp-beta}

# P2: cap container log growth (json-file default grows unbounded). Applied to
# every long-lived service below via `logging: *log`.
x-logging: &log
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# NO cpu/memory limits, deliberately. Per-service `mem_limit` + `cpus` ceilings
# used to live here (sized for a 4 GB / 2 vCPU host) and did far more harm than
# good: `cpus` is a hard CFS quota, not a share, so the backend was throttled to
# its slice even when the box was idle. That starved the V8 isolates — trivial
# UDFs (rateLimits.enforce, connectionModes.list) hit UserTimeout, each timeout
# restarted an isolate, and the restart cold-imported the whole function bundle,
# which timed out again. `convex deploy` failed the same way, with module Analyze
# blowing the 4s cap. The ceilings also summed to ~5 CPUs of quota on a 2 vCPU
# host, so they never described reality anyway.
#
# The kernel already handles genuine contention (CPU shares + the OOM killer),
# and `restart: unless-stopped` recovers a killed container. If a service needs
# bounding, bound THAT service on evidence — do not reinstate a blanket set.
# `pids_limit` stays: it caps fork-bomb blast radius and throttles nothing.

services:
  backend:
    # Convex ships one image per commit, and EVERY image tag is a GitHub release
    # (`precompiled-<date>-<sha7>` in get-convex/convex-backend). So the tag here
    # is the git sha of a release: 0dda4d6 = precompiled-2026-08-14-0dda4d6 (the npm 1.44.0 anchor).
    #
    # The tag is what makes an upgrade auditable. Convex stopped maintaining
    # self-hosted/CHANGELOG.md in 2025-09 ("check `git log` for a detailed
    # listing of changes"), so `git log <pinned>..<target>` IS the changelog —
    # and you can only run it if the pin names a commit. A bare digest cannot
    # tell you what you are on.
    #
    # Dependabot CANNOT bump these (a 40-hex tag fails its NAME_WITH_VERSION
    # regex, so it is not version-comparable). Instead,
    # .github/workflows/convex-repin.yml opens a monthly re-pin PR anchored to
    # the newest ship.convex.dev (npm) release, scripts/convex-repin.sh rewrites
    # the three refs + the release-name comment above (which
    # convex/deployPins.test.ts asserts matches the pin — don't hand-edit one
    # without the other), and .github/workflows/convex-release-watch.yml files
    # an issue only if that flow stalls.
    #
    # Backend and dashboard MUST share this tag: "Make sure to use the same
    # version of convex-backend and convex-dashboard. Different versions are not
    # guaranteed to be compatible" (self-hosted/CHANGELOG.md). One git sha tags
    # both images; convex/deployPins.test.ts enforces it.
    #
    # Upgrading runs in-place DB migrations. Take an export first, then watch for
    # `MigrationComplete(N)` in the backend log (self-hosted/advanced/upgrading.md).
    # Full procedure: docs/beta-deploy.md § Upgrading the Convex backend.
    image: ghcr.io/get-convex/convex-backend:0dda4d6a68612c6ba49c755e410feca46f56f7ce@sha256:e6952cd9550fbc88bd09677b5c4f0fab5961dd0b870fca46822fb0b339ecd2bf
    pids_limit: 512
    restart: unless-stopped
    logging: *log
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '127.0.0.1:${PORT:-3210}:3210'
    volumes:
      - data:/convex/data
    environment:
      - ACTIONS_USER_TIMEOUT_SECS=${ACTIONS_USER_TIMEOUT_SECS:-120}
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=16
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=16
      - APPLICATION_MAX_CONCURRENT_QUERIES=16
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=16
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN}
      - DISABLE_BEACON=${DISABLE_BEACON:-true}
      - DO_NOT_REQUIRE_SSL=true
      - INSTANCE_NAME=${INSTANCE_NAME}
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      # Postgres connection string WITHOUT a db name or query params: Convex
      # derives the database from INSTANCE_NAME (hyphens -> underscores). SSL on
      # the link is disabled via DO_NOT_REQUIRE_SSL above (private compose net).
      - POSTGRES_URL=postgresql://convex:${POSTGRES_PASSWORD}@postgres:5432
      # Don't echo internal error detail to API clients in prod.
      - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-true}
      # Privacy default: silence the per-request HTTP access log
      # (convex-cloud-http logs the immediate peer's socket + request line) while
      # keeping warnings/errors. FCP never persists client IPs, so the request
      # log is pure noise here — and the peer is Caddy's container, but quiet-by-
      # default is the posture. Verify after deploy:
      #   docker compose -f docker-compose.beta.yml logs backend | grep 'GET /api'  # → empty
      # If a Convex version renames that target, fall back to RUST_LOG=warn.
      # See docs/privacy.md.
      - RUST_LOG=${RUST_LOG:-info,convex-cloud-http=warn}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 10s
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Postgres 18: the production datastore (exercised on beta before prod). The
  # backend connects to a database named after INSTANCE_NAME with hyphens
  # replaced by underscores, so POSTGRES_DB below MUST match it (keep them in
  # sync). It defaults to freesocks_beta and can be overridden via POSTGRES_DB
  # in .env.beta — set that instead of editing this file so the postgres env,
  # the pg_isready healthcheck, and the backup sidecar can't drift apart (an
  # INSTANCE_NAME-only change used to leave pg_dump successfully backing up the
  # EMPTY old DB with a green heartbeat).
  postgres:
    # Pinned by digest like every other image (re-pin on upgrade:
    # docker buildx imagetools inspect postgres:18).
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    pids_limit: 512
    restart: unless-stopped
    logging: *log
    stop_grace_period: 10s
    environment:
      - POSTGRES_USER=convex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.beta}
      - POSTGRES_DB=${POSTGRES_DB:-freesocks_beta}
    volumes:
      # PG18 moved the image VOLUME to /var/lib/postgresql (PGDATA defaults to
      # /var/lib/postgresql/18/docker inside it). Do NOT mount the pre-18
      # /var/lib/postgresql/data path or the container refuses to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convex -d $${POSTGRES_DB}']
      interval: 10s
      start_period: 20s
      retries: 5

  # A3: automated Postgres backups. pg_dumps on an interval and ships the dump to
  # S3-compatible object storage (set S3_* + AWS_* in .env.beta), pruning old
  # local copies. WARNING: without S3_* it keeps LOCAL-ONLY copies (no offsite) —
  # configure offsite before launch. Restore drill: docs/beta-deploy.md.
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    pids_limit: 128
    restart: unless-stopped
    logging: *log
    stop_grace_period: 10s
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=convex
      - POSTGRES_DB=${POSTGRES_DB:-freesocks_beta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.beta}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-7}
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - S3_PREFIX=${BACKUP_S3_PREFIX:-db-backups}
      - AWS_ACCESS_KEY_ID=${BACKUP_AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${BACKUP_AWS_REGION:-auto}
      # Explicit risk-acceptance opt-out: without BACKUP_S3_*, the sidecar
      # exits fatally unless this is 'true' (see docker/backup.sh).
      - BACKUP_ALLOW_LOCAL_ONLY=${BACKUP_ALLOW_LOCAL_ONLY:-}
      # age recipient for client-side dump encryption (recommended); the warning
      # is silenced with BACKUP_ALLOW_UNENCRYPTED=true.
      - BACKUP_AGE_PUBLIC_KEY=${BACKUP_AGE_PUBLIC_KEY:-}
      - BACKUP_ALLOW_UNENCRYPTED=${BACKUP_ALLOW_UNENCRYPTED:-}
    volumes:
      - backups:/backups
    healthcheck:
      # Liveness = the last SUCCESSFUL cycle finished within the last interval
      # (+1h slack): backup.sh touches /backups/.heartbeat only when the dump AND
      # the offsite upload (when enabled) succeeded, so a failing S3 destination
      # reads unhealthy instead of silently missing offsite copies. (A crashed
      # sidecar is caught by the fail-fast gate + restart policy.)
      test:
        [
          'CMD-SHELL',
          'test -f /backups/.heartbeat && [ $(( $(date +%s) - $(stat -c %Y /backups/.heartbeat) )) -lt $(( ${BACKUP_INTERVAL_SECONDS:-86400} + 3600 )) ]',
        ]
      interval: 300s
      # First dump can take a while on a large DB; don't flag unhealthy before it.
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # Admin-only Convex dashboard, bound to localhost (reach via SSH tunnel:
  # `ssh -L 6791:127.0.0.1:6791 -L 3210:127.0.0.1:3210 beta-host`).
  dashboard:
    # Same release git sha as `backend` above — required, not cosmetic.
    image: ghcr.io/get-convex/convex-dashboard:0dda4d6a68612c6ba49c755e410feca46f56f7ce@sha256:36668f7a304b6a3fccd1a5ff28ad05a242c37944beab5f8a90f81a2d4e235de7
    pids_limit: 256
    restart: unless-stopped
    logging: *log
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-6791}:6791'
    environment:
      # Default = the on-host tunnel URL. To run the dashboard remotely via Caddy
      # (see the optional blocks in Caddyfile), set CONVEX_DASHBOARD_DEPLOYMENT_URL
      # to the PUBLIC deploy-API host (https://<CONVEX_API_ADDRESS>) — the
      # dashboard's browser connects there.
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_DASHBOARD_DEPLOYMENT_URL:-http://127.0.0.1:3210}
    depends_on:
      backend:
        condition: service_healthy

  # Self-hosted Cap captcha (W1): the proof-of-work CAPTCHA that replaced
  # Cloudflare Turnstile. Caddy proxies the public /cap path here (widget
  # endpoints + the ADMIN_KEY-gated admin dashboard — the deployment fronts
  # this host with an authenticating edge, Pangolin + CrowdSec, that gates the
  # admin paths); the backend verifies tokens over the compose network
  # (CAP_API_ENDPOINT=http://cap:3000).
  cap:
    # Pinned tag@digest on a real semver tag (upstream release standalone@3.1.8),
    # NOT `latest` — so a Dependabot bump names the actual version change instead
    # of "latest moved". Re-pin by hand if needed:
    # docker buildx imagetools inspect tiago2/cap:<version>.
    image: tiago2/cap:3.1.9@sha256:98fdaaf4ffe6bea18549484a431c601399f24dd561370e196970e6fc0e6b79d0
    pids_limit: 256
    restart: unless-stopped
    logging: *log
    stop_grace_period: 10s
    ports:
      # Fallback admin access with no edge/auth layer in the path (loopback
      # only; ssh -L 3000:127.0.0.1:3000 <host>). Useful if the fronting
      # proxy is down or misconfigured.
      - '127.0.0.1:${CAP_DASHBOARD_PORT:-3000}:3000'
    environment:
      - ADMIN_KEY=${CAP_ADMIN_KEY:?set CAP_ADMIN_KEY in .env.beta (>=32 chars)}
      - REDIS_URL=redis://valkey:6379
      # Privacy default: quiet Cap's error logging so a client IP can't surface
      # in a stack trace. Cap rate-limits on the compose peer (Caddy) and its IP
      # geolocation stays off (dashboard default) — do NOT enable either against a
      # real-client header. See docs/privacy.md.
      - DISABLE_ERROR_LOGGING=${CAP_DISABLE_ERROR_LOGGING:-true}
    healthcheck:
      # The image ships NO wget/curl (verified against the pinned digest) — a
      # wget-based check fails with exit 127 on every probe and marks a
      # perfectly healthy server unhealthy, which blocks `web` (depends_on)
      # forever. bun is the image's runtime; fetch resolves on ANY HTTP
      # response (server up) and throws on connection refused.
      test: ['CMD', 'bun', '-e', "await fetch('http://localhost:3000/')"]
      interval: 15s
      start_period: 15s
      retries: 5
    depends_on:
      valkey:
        condition: service_healthy

  # Cap's datastore (Redis-compatible). Persists issued challenges/tokens.
  valkey:
    # Pinned by digest (re-pin: docker buildx imagetools inspect valkey/valkey:9-alpine).
    # Cap uses it purely as a Redis-compatible store (challenges/tokens), so the
    # 8→9 bump is transparent; the --save/--appendonly flags below are unchanged.
    image: valkey/valkey:9-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    pids_limit: 128
    restart: unless-stopped
    logging: *log
    stop_grace_period: 10s
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      start_period: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # CDN-blinding (E2EE) public pins, interpolated from .env.beta — filled by
      # `bun scripts/bootstrap-secrets.mjs` (the private halves go to the Convex
      # deployment env via the deployer). Empty (the `:-` default, i.e. bootstrap
      # not run) = the SPA ships DARK (plaintext dual-mode over TLS); filled =
      # body-sealing is ON. Rebuild `web` after the bootstrap so the pins bake in.
      args:
        VITE_FS_SERVER_HPKE_PK: ${VITE_FS_SERVER_HPKE_PK:-}
        VITE_FS_SERVER_HPKE_KID: ${VITE_FS_SERVER_HPKE_KID:-}
        VITE_FS_MANIFEST_PK: ${VITE_FS_MANIFEST_PK:-}
        VITE_FS_MANIFEST_PK_PQ: ${VITE_FS_MANIFEST_PK_PQ:-}
    pids_limit: 256
    restart: unless-stopped
    logging: *log
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persists the Let's Encrypt cert + account
      - caddy_config:/config
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-beta.freesocks.org}
      - ACME_EMAIL=${ACME_EMAIL:-}
      # http = plain HTTP on :80, ACME off (edge-fronted / Tailscale-proxy
      # deployments); https (default) = Caddy manages a public LE cert.
      - CADDY_SCHEME=${CADDY_SCHEME:-https}
      # Client-IP trust: set to the fronting proxy's peer IP/CIDR (e.g. the tailnet
      # 100.64.0.0/10) ONLY when something fronts Caddy (Pangolin / CF Tunnel / LB).
      # Empty = Caddy is the public edge (overwrites XFF). See Caddyfile + docs.
      - CADDY_TRUSTED_PROXIES=${CADDY_TRUSTED_PROXIES:-}
      # Set true ONLY when a real Cloudflare edge fronts this deployment AND the
      # origin rejects non-CF traffic: Caddy then passes CF-Connecting-IP through
      # to the backend (needed for CF_FRONTED / the analytics Cloudflare IP
      # source). Default: the header is stripped (spoofable otherwise).
      - CADDY_TRUST_CF_HEADER=${CADDY_TRUST_CF_HEADER:-}
      # Optional Convex-dashboard exposure (see the commented site blocks in
      # Caddyfile + docs/beta-deploy.md). Empty unless you opt in; Caddy only
      # references them when those blocks are uncommented.
      - CONVEX_DASHBOARD_ADDRESS=${CONVEX_DASHBOARD_ADDRESS:-}
      - CONVEX_API_ADDRESS=${CONVEX_API_ADDRESS:-}
    healthcheck:
      # The public edge: a wedged Caddy is otherwise only caught by the external
      # /readyz monitor. Check the backend's health endpoint over the compose
      # network — NOT http://localhost/healthz: Caddy's http→https redirect
      # forces a TLS handshake with SNI "localhost", which Caddy has no cert
      # for (it alerts with a server-side internal error, so the old check
      # could never pass even with a valid site cert). wget ships in the
      # alpine image (busybox).
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://backend:3211/healthz || exit 1']
      interval: 30s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      cap:
        condition: service_healthy

  # One-shot: derive a valid admin key from INSTANCE_NAME + INSTANCE_SECRET (a
  # standalone derivation via the backend image's generate_admin_key.sh, no
  # running server needed) and write it to the shared `convexkey` volume for the
  # deployer. The key is accepted by the backend because it shares INSTANCE_SECRET.
  keygen:
    image: ghcr.io/get-convex/convex-backend:0dda4d6a68612c6ba49c755e410feca46f56f7ce@sha256:e6952cd9550fbc88bd09677b5c4f0fab5961dd0b870fca46822fb0b339ecd2bf
    pids_limit: 128
    restart: 'no'
    logging: *log
    entrypoint: ['/bin/bash', '-c']
    command: ["./generate_admin_key.sh | grep '|' | tail -n1 > /keys/admin_key"]
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME}
      - INSTANCE_SECRET=${INSTANCE_SECRET:?set INSTANCE_SECRET in .env.beta}
    volumes:
      - convexkey:/keys

  # One-shot: push the Convex functions, apply the deployment env from
  # .env.convex, and seed (tiers + settings + the env-configured backend
  # instance). Runs after the backend is healthy and the admin key exists.
  # Idempotent, so it re-runs harmlessly on every `up`; exits 0 on success
  # (check `docker compose -f docker-compose.beta.yml logs deployer`).
  deployer:
    build:
      context: .
      dockerfile: docker/deploy.Dockerfile
    # Unbounded like everything else here. `convex deploy` bundles + typechecks
    # convex/ and `tsc` is memory-hungry: a 512m ceiling once OOM-killed it
    # (exit 137) before the deploy even ran, silently leaving the backend on the
    # old code — the exact failure mode the header warns about.
    pids_limit: 256
    restart: 'no'
    logging: *log
    environment:
      - CONVEX_SELF_HOSTED_URL=http://backend:3210
    volumes:
      - convexkey:/keys:ro
      # The application secrets to apply (copy .env.convex.example -> .env.convex).
      - ./.env.convex:/run/convex.env:ro
    depends_on:
      backend:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

volumes:
  data:
  pgdata:
  convexkey:
  caddy_data:
  caddy_config:
  valkey_data:
  backups:
