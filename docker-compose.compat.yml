# The client cannot reach origin's network. Only the proxy joins both networks.
services:
  compat-proxy:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/compat/Dockerfile
    image: fcp-compat-engine:local
    volumes:
      - ./.cache/compat/runtime:/work:ro
    command: [sing-box, run, -c, /work/server.json]
    networks: [default, compat-origin]
  compat-client:
    platform: linux/amd64
    image: fcp-compat-engine:local
    volumes:
      - ./.cache/compat/runtime:/work
    networks: [default]
  compat-origin:
    image: oven/bun:${FCP_COMPAT_BUN_VERSION:?read from packageManager by test:compat}
    volumes:
      - ./docker/compat/origin.mjs:/origin.mjs:ro
      - ./.cache/compat/runtime:/work:ro
    command: [bun, /origin.mjs]
    networks: [compat-origin]

  # Front qualification (docker/compat/frontcheck-up.sh): the REAL software the
  # relay nodes run, so the check is proved against Xray-core rather than
  # against a fake that returns what the checker expects. Pinned by digest to
  # the Xray inside the remnawave/node image the nodes run, read with
  # `docker run --rm --entrypoint xray remnawave/node:<version> version`.
  # Dependabot ignores this pin (it would move it past what the nodes run):
  # re-pin it by hand when the node image's Xray moves.
  compat-frontcheck-xray:
    platform: linux/amd64
    image: ghcr.io/xtls/xray-core:26.7.28@sha256:b697cda1588faca696ab7f7755dd1161f60862af3ff6026300e44cff6aedd558
    volumes:
      - ./docker/compat/frontcheck-xray.json:/etc/xray/config.json:ro
      - ./.cache/compat/frontcheck:/etc/xray/tls:ro
    command: [run, -c, /etc/xray/config.json]
    # Loopback only: these inbounds accept a known test credential.
    ports:
      - '127.0.0.1:18443:18443'
      - '127.0.0.1:18444:18444'
      - '127.0.0.1:18445:18445'
      - '127.0.0.1:18446:18446'
      - '127.0.0.1:18447:18447'
    depends_on: [compat-frontcheck-origin]
    networks: [compat-frontcheck]
  compat-frontcheck-origin:
    image: oven/bun:${FCP_COMPAT_BUN_VERSION:?read from packageManager by test:compat}
    volumes:
      - ./docker/compat/frontcheck-origin.mjs:/origin.mjs:ro
    command: [bun, /origin.mjs]
    networks:
      compat-frontcheck:
        # A fixed address: the Xray image is distroless, so the test must not
        # depend on name resolution inside it (the outbound redirects here).
        ipv4_address: 10.89.71.10

  # REALITY key shares (scripts/compat/reality-keyshare.sh,
  # convex/lib/realityKeyShares.integration.test.ts): the pinned sing-box and
  # Mihomo against two real Xray-cores, the one the node image runs (the same
  # pin as the front check above) and a release from v26.9.8 on, which refuses
  # a Client Hello without X25519MLKEM768. The test writes the Xray config (a
  # fresh key and client id per run) before it starts these. Both Xray pins
  # move by hand: the latest one stays past v26.9.8 on purpose.
  compat-reality-xray-fleet:
    platform: linux/amd64
    image: ghcr.io/xtls/xray-core:26.7.28@sha256:b697cda1588faca696ab7f7755dd1161f60862af3ff6026300e44cff6aedd558
    volumes:
      - ./.cache/compat/reality/xray.json:/etc/xray/config.json:ro
    command: [run, -c, /etc/xray/config.json]
    depends_on: [compat-reality-target]
    networks:
      compat-reality-edge:
        ipv4_address: 10.89.72.11
      compat-reality-origin:
        ipv4_address: 10.89.73.11
  compat-reality-xray-latest:
    platform: linux/amd64
    image: ghcr.io/xtls/xray-core:26.10.21@sha256:d5c3729dfeed7c412af17a63b941c48c76ba68afee5b6184fe4078f8fa8bedcc
    volumes:
      - ./.cache/compat/reality/xray.json:/etc/xray/config.json:ro
    command: [run, -c, /etc/xray/config.json]
    depends_on: [compat-reality-target]
    networks:
      compat-reality-edge:
        ipv4_address: 10.89.72.12
      compat-reality-origin:
        ipv4_address: 10.89.73.12
  # FCP's own client check (scripts/compat/client-check.sh,
  # convex/lib/edges/clientCheck/clientCheck.integration.test.ts): the service
  # built from docker/edge-client-check/ checks through two cores of the fleet
  # release, one whose REALITY transports set minClientVer 1.8.1 and one that
  # leaves it unset (that release then refuses sing-box). The test writes both
  # configs first; their tunnels end at the target's echo page, which answers the
  # core's own address (the egress the check reads).
  compat-check-xray-min:
    platform: linux/amd64
    image: ghcr.io/xtls/xray-core:26.7.28@sha256:b697cda1588faca696ab7f7755dd1161f60862af3ff6026300e44cff6aedd558
    volumes:
      - ./.cache/compat/client-check/min.json:/etc/xray/config.json:ro
    command: [run, -c, /etc/xray/config.json]
    depends_on: [compat-reality-target]
    networks:
      compat-reality-edge:
        ipv4_address: 10.89.72.21
      compat-reality-origin:
        ipv4_address: 10.89.73.21
  compat-check-xray-nomin:
    platform: linux/amd64
    image: ghcr.io/xtls/xray-core:26.7.28@sha256:b697cda1588faca696ab7f7755dd1161f60862af3ff6026300e44cff6aedd558
    volumes:
      - ./.cache/compat/client-check/nomin.json:/etc/xray/config.json:ro
    command: [run, -c, /etc/xray/config.json]
    depends_on: [compat-reality-target]
    networks:
      compat-reality-edge:
        ipv4_address: 10.89.72.22
      compat-reality-origin:
        ipv4_address: 10.89.73.22
  # The service itself, as the stack builds it. Private addresses are admitted
  # for this harness only (the cores sit on them). Its API is published on
  # loopback through a second, non-internal network; the edge network stays
  # internal, so the only way to the echo page is through a tunnel.
  compat-client-check:
    build:
      context: .
      dockerfile: docker/edge-client-check/Dockerfile
    environment:
      - EDGE_CLIENT_CHECK_SECRET=compat-client-check-secret
      - EDGE_CLIENT_CHECK_ALLOW_PRIVATE=true
      - EDGE_CLIENT_CHECK_EGRESS_URL=http://egress.example/
    ports:
      - '127.0.0.1:18090:8080'
    networks:
      compat-reality-edge:
        ipv4_address: 10.89.72.30
      compat-client-check-api: {}
  # The REALITY target (TLS 1.3, a name only it serves) and the page the
  # tunnels reach, on a network the client is not on.
  compat-reality-target:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    volumes:
      - ./docker/compat/reality-target.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      compat-reality-origin:
        ipv4_address: 10.89.73.20
  compat-reality-client:
    platform: linux/amd64
    image: fcp-compat-engine:local
    volumes:
      - ./.cache/compat/reality/client:/work
    networks:
      compat-reality-edge:
        ipv4_address: 10.89.72.100

networks:
  compat-origin:
    internal: true
  # Not `internal`: the Xray inbounds are published on loopback, and published
  # ports are not reliably routed on an internal network. Nothing here reaches
  # the internet by itself anyway (the outbound redirects to the origin above).
  compat-frontcheck:
    ipam:
      config:
        - subnet: 10.89.71.0/24
  # Nothing here reaches the internet: the client reaches the two Xray-cores
  # only, and they reach the target and the page only.
  compat-reality-edge:
    internal: true
    ipam:
      config:
        - subnet: 10.89.72.0/24
  compat-reality-origin:
    internal: true
    ipam:
      config:
        - subnet: 10.89.73.0/24
  # The client check service's API only (a published port needs a routed network).
  compat-client-check-api: {}
