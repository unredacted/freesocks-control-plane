# Dependabot version updates.
#
# Scope: the container supply chain only (compose image pins, Dockerfile base
# images, CI action pins). Application dependencies (bun.lock) are deliberately
# NOT enrolled — see the commented block at the bottom.
#
# Everything in the stack is digest-pinned on purpose (supply-chain safety, see
# the docker-compose.stack.yml header). Re-pinning by hand is easy to forget:
# the prod backup sidecar ran a broken image for four weeks in Aug 2026 because
# nothing was watching. Dependabot updates BOTH halves of a `tag@sha256:` pin.
#
# Everything here opens a PR; nothing auto-merges. Review before deploying, and
# note that a deploy is `up -d --build --force-recreate` (docs/beta-deploy.md §6).
#
# ONE PR PER UPSTREAM RELEASE: some images are pinned in a compose file AND a
# Dockerfile, and each Dependabot ecosystem only sees its own files, so until
# Oct 2026 one release arrived as two PRs that each failed CI alone (or worse,
# passed and merged alone). The compose entry and the /docker entry below are
# now one multi-ecosystem group, `stack-images`: one PR carries every file.
# The pins that move together, and why:
#  - postgres: the server in docker-compose.stack.yml and the backup sidecar's
#    `FROM` in docker/backup.Dockerfile. An older pg_dump refuses to dump a
#    newer-major server, so a compose-only bump silently breaks backups.
#  - caddy: docker/web.Dockerfile (the deployed SPA server) and the test compose
#    files. CI's `caddyfile` job reads the image from web.Dockerfile rather than
#    holding a copy (a copy is a `docker run` ref no ecosystem updates).
#  - oven/bun: the three /docker Dockerfiles must equal `packageManager` in
#    package.json, which Dependabot does NOT touch (the bun ecosystem below only
#    allows the convex packages): a Bun PR fails until packageManager is bumped
#    in it by hand.
# Not coupled, on purpose: the Node in docker/convex-node/ follows Convex's
# .nvmrc (22) while the test images follow the clients (24); the sidecar's
# Xray is a client and moves alone, while docker-compose.compat.yml's Xray pins
# follow the fleet and are ignored below. convex/deployPins.test.ts fails the
# build the moment a coupled pair disagrees, whatever produced the change.
#
# MULTI-ECOSYSTEM RULES (docs: "Configuring multi-ecosystem updates"). Get one
# wrong and the file is invalid, which stops EVERY entry here, the daily Node
# security one included; convex/deployPins.test.ts checks them:
#  - `schedule`, `labels` and `commit-message` sit on the group. commit-message,
#    target-branch, milestone and pull-request-branch-name are group-only: on a
#    member entry they are a configuration error.
#  - Each member entry needs `patterns` (it replaces `groups`); `ignore` and
#    `cooldown` stay per entry.
#
# EXACT VERSION TAGS: every pin names a full upstream version (`caddy:2.11.7-
# alpine`, `postgres:18.6-trixie`, a dated `debian:trixie-YYYYMMDD-slim`), never
# a floating `2-alpine` / `18` / `13-slim`. With a floating tag Dependabot only
# sees the digest move, so every PR read "bump caddy from 2-alpine to 2-alpine".
# Now a release reads "2.11.7-alpine to 2.11.8-alpine" and a same-version
# rebuild (an Alpine/Debian base refresh, or one architecture re-pushed) reads
# "2.11.7-alpine to 2.11.7-alpine". Re-pin by hand the same way: the exact tag,
# and its digest from `docker buildx imagetools inspect <image>:<exact tag>`.
#
# SCHEDULE: the images production runs are checked every day. Dependabot does
# not know about vulnerabilities inside an image: no security update ever fires
# for one, so a fixed image reaches us only as a version update ("a newer tag or
# digest exists"), and on a weekly schedule that meant up to a week. It came to
# a head in Oct 2026: the Bun and Cap releases fixing three high Bun advisories
# shipped on a Thursday and would have waited for the next Monday. `cron`, not
# `interval: daily`, because daily skips weekends (same as the convex-node entry
# below). The compose entry covers the test compose files too (same PR either
# way); the test-only Dockerfiles stay weekly.
#
# COOLDOWN: GitHub holds every version update back 3 days by default (since Jul
# 2026, with no `cooldown` key at all), so a malicious release has time to be
# caught before it reaches a PR. For images that same wait delays every security
# fix, since a version update is their only route in. Every entry sets 1 day: a
# new version is proposed one to two days after it is published. Bump by hand
# when an image fix can't wait a day.

version: 2

multi-ecosystem-groups:
  stack-images:
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Etc/UTC
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(docker)

updates:
  # --- compose image pins (stack-images) -----------------------------------
  # Matches docker-compose.yml, docker-compose.stack.yml and the test compose
  # files: Dependabot's compose matcher is
  # /(docker-)?compose(-[\w]+)?(\.[\w-]+)?\.ya?ml/i, so the `.stack` /
  # `.remnawave-test` infixes are covered.
  #
  # NOT here: `ghcr.io/convex/convex-*`. Those are pinned to a release git
  # sha, which Dependabot cannot version-compare (a 40-hex tag fails its
  # NAME_WITH_VERSION regex), so it will never open a PR for them.
  # `.github/workflows/convex-release-watch.yml` is their watcher instead, and
  # convex/deployPins.test.ts keeps backend and dashboard on the same release.
  # See the comment on the `backend` service in docker-compose.stack.yml.
  #
  # Two of the remaining ones want a human, not a rubber stamp:
  #  - `tiago2/cap` is the accepted-risk image (docs/beta-deploy.md
  #    § "Cap image provenance"). Pinned tag@digest on a real semver tag
  #    (was `latest` until 2026-08-25), so the PR names the actual version
  #    jump — check the upstream release notes (tiagorangel1/cap, releases
  #    tagged `standalone@<version>`) before merging. Not every version gets a
  #    release (none after 3.1.13 as of 3.1.17): then read the commits under
  #    standalone/ and core/ since the pinned version.
  #  - `remnawave/backend` is only the throwaway integration-test panel in
  #    docker-compose.remnawave-test.yml, whose whole job is to catch provider
  #    contract drift. Bumping it is in scope, but it should track whatever
  #    version the REAL panels run (the separate Ansible repo), or the
  #    integration test starts asserting a contract production does not have.
  #    The provider speaks both the 2.x (uuid) and 3.x (numeric id) contracts
  #    since 2026-09-01, so majors flow again — but a bump here is only as good
  #    as `bun run test:integration:remnawave` against the new tag (opt-in, not
  #    in CI): run it before merging. Lesson: the 2.8.0->3.3.2 bump of
  #    2026-08-25 broke the harness silently (APP_SECRET) and nobody noticed
  #    for a week.
  #
  # Ignored: `xtls/xray-core` in docker-compose.compat.yml. The front check is
  # proved against the Xray inside the remnawave/node image the nodes run, so
  # that pin follows the node image by hand (see the comment on the service);
  # Dependabot would move it to whatever Xray released last. Its first update
  # after the pin was stuck did exactly that, and the front check broke: newer
  # Xray blocks private targets in `freedom` unless a `finalRules` entry
  # allows them (docker/compat/frontcheck-xray.json). The REALITY key share
  # test's second pin (a release from v26.9.8 on) moves by hand too.
  #
  # `patterns: ['*']` with NO `update-types` filter, deliberately. A filter looks
  # like a way to keep majors out, but it silently drops DIGEST-ONLY updates
  # (dependabot-core's `semver_rules_allow_grouping?` bails when either side
  # fails `Version.correct?` or major/minor/patch are all equal); the first run
  # with one produced zero grouped PRs. So majors ride in the PR. That is the
  # accepted trade: a major here fails LOUDLY at deploy (PG19 refuses a PG18
  # data dir) rather than silently, the PR body names every bump, and the
  # cross-file locks in convex/deployPins.test.ts still fail CI on a half-
  # applied one.
  - package-ecosystem: docker-compose
    directory: /
    multi-ecosystem-group: stack-images
    patterns: ['*']
    cooldown:
      default-days: 1
    ignore:
      - dependency-name: xtls/xray-core

  # --- Dockerfile base images (stack-images) --------------------------------
  # docker/{web,deploy,backup}.Dockerfile and docker/edge-client-check/ (FCP's
  # own client check: its sing-box, Xray and Mihomo pins are the clients it
  # checks with, production runtime, so daily too). The Convex images' Node
  # (docker/convex-node/) has its own entry below, and the test images theirs.
  - package-ecosystem: docker
    directories: [/docker, /docker/edge-client-check]
    multi-ecosystem-group: stack-images
    patterns: ['*']
    cooldown:
      default-days: 1

  # --- test-only Dockerfile base images --------------------------------------
  - package-ecosystem: docker
    # Not recursive: docker/compat/ (the client-compatibility images) and
    # docker/edge-connection-test/ must be listed explicitly or their base
    # images never get update PRs (the edge-connection runner's node pin sat
    # unwatched until Oct 2026). Their node pins are test-only, so weekly.
    directories: [/docker/compat, /docker/edge-connection-test]
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(docker)
    groups:
      test-images:
        patterns: ['*']
    ignore:
      # A new Node major is a person's call (the test images follow the one the
      # clients use).
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # --- the Node inside the Convex images -------------------------------------
  # docker/convex-node/Dockerfile copies a pinned official Node over the one in
  # the Convex backend and dashboard images, whose upstream .nvmrc does not
  # follow Node security releases. The production runtime, so checked every
  # day: weekly is too slow for a Node security release, and GitHub's advisory
  # database never covers the runtime, so no Dependabot security update fires
  # for one. The Oct 2026 release landed on a Wednesday and would have waited
  # five days.
  #
  # `cron`, not `interval: daily`, because daily skips weekends. 21:00 UTC lands
  # after the usual US-daytime release (Docker Hub had the Oct 2026 images by
  # 17:38). GitHub documents no sub-daily floor for cron and no public config
  # uses one, so this does not try: a rejected schedule would stop every entry.
  - package-ecosystem: docker
    directory: /docker/convex-node
    schedule:
      interval: cron
      cronjob: '0 21 * * *'
      timezone: Etc/UTC
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(docker)
    ignore:
      # Stay on the major in Convex's .nvmrc; convex-repin.yml says when it
      # moves, and convex-release-watch.yml fails before this one's end of life.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # --- CI action pins -------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
  # --- the convex CLI/client (npm) ------------------------------------------
  # The THIRD Convex version in the stack, and the only one with real semver —
  # this is what ship.convex.dev publishes (v1.44.0 and friends). It is not the
  # backend: `ghcr.io/convex/convex-*` has never carried a semver tag, only
  # per-commit git shas (the curated `self-hosted-release-<date>-<sha>` git tags
  # stopped in 2025-09).
  #
  # It matters because `docker/deploy-entrypoint.sh` runs `bunx convex …` from
  # THIS lockfile: the pinned CLI is what pushes functions, schema and env to the
  # pinned backend, and Convex's self-hosted README says to keep it current
  # ("you'll need the latest version of Convex").
  #
  # `allow` keeps this to the convex packages only. The rest of the tree
  # (Svelte/Vite/Tailwind) stays out on purpose: a weekly firehose of PRs against
  # a security-sensitive SPA is worse than a deliberate `bun update` with the
  # full suite green. Widen `allow`, don't delete it, if that changes.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    allow:
      - dependency-name: convex
      - dependency-name: '@convex-dev/*'
