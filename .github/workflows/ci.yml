name: CI
on:
  pull_request:
  push:
    branches: [main, v2]

# Force JS actions onto Node 24 (Node 20 is deprecated; Node 24 is the runner
# default from 2026-06-16, after which this is a harmless no-op). Covers any
# action whose own version still bundles Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Read-only token: no job here writes to the repo, issues or PRs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun version comes from `packageManager` in package.json — ONE source of
      # truth shared with the Dockerfile base images (convex/deployPins.test.ts
      # locks those to it). A literal `bun-version:` here would be a fourth copy
      # that Dependabot never touches, so CI could silently run a different Bun
      # than the deployed images.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Note: convex/_generated is committed (it can't be regenerated in CI
      # without a Convex deployment, and Convex recommends committing it), so the
      # convex typecheck + the convex-test suite work here with no backend.

      # Typecheck spans client + shared + convex + Svelte components.
      - run: bun run typecheck

      # Offline reproduction of the `convex deploy` bundle step: every non-test
      # file under convex/ is a bundler entry point, and one without "use node"
      # that reaches a Node built-in (or a Node-only dependency) only fails on
      # the deployer. scripts/convex-bundle-check.mjs mirrors the CLI's split.
      - run: bun run convex:bundle-check

      # convex-test suite (in-memory; no backend needed).
      - run: bun run test

      # eslint + prettier --check (was the deploy workflow's extra gate before
      # deploy.yml was removed in favour of manual deploys).
      - run: bun run lint

      # Build the SPA (the only build artifact now; the backend is convex/).
      - run: bun run build

  # The deploy artifacts themselves: every stack Dockerfile must build, and the
  # shell entrypoints must pass shellcheck (a broken entrypoint otherwise merges
  # green and only fails on the beta host at deploy time).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck the docker and repo scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error docker/*.sh docker/compat/*.sh scripts/*.sh
      - name: Build docker images (no cache)
        run: |
          docker build -f docker/web.Dockerfile .
          docker build -f docker/backup.Dockerfile .
          docker build -f docker/deploy.Dockerfile .
      # The Convex backend and dashboard on the patched Node, from the exact
      # refs the stack pins. The overlay's RUN step fails if the binary cannot
      # load against the image's libraries.
      - name: Build the Convex images with the patched Node
        run: |
          for img in convex-backend convex-dashboard; do
            ref="$(grep -oE "ghcr\.io/convex/$img:[0-9a-f]{40}@sha256:[0-9a-f]{64}" docker-compose.stack.yml | head -1)"
            docker build --build-arg CONVEX_IMAGE="$ref" docker/convex-node
          done

  # Reproducible build (CDN-blinding Phase 3f): build twice from a clean checkout
  # and assert byte-for-byte identical output. The printed dist-sha256 is the hash
  # we publish out of band and an independent rebuilder reproduces (see
  # docs/oob-verification.md).
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same single source of truth as the `check` job above. A reproducible
      # build especially must not pin Bun independently of the images.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify-reproducible.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # Static analysis of the workflow files themselves: expression typos, invalid
  # `if:` conditions, unknown contexts, and shellcheck over every `run:` block.
  # Pinned by digest; Dependabot does not track `docker run` refs in workflows,
  # so bump this by hand alongside the other tool pins.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

  # Validate the Caddyfile adapts + parses (catches the servers/trusted_proxies
  # block + the {$CADDY_TRUSTED_PROXIES} placeholder syntax). All active env
  # placeholders carry defaults, so no env is needed. The Caddy is the one
  # docker/web.Dockerfile deploys, read from its FROM line, the way the Bun above
  # comes from package.json. A copy pinned here drifted once (CI validated a
  # different Caddy than deployed for weeks), and its later drift guard failed
  # every Caddy bump, since no Dependabot ecosystem updates a `docker run` ref.
  caddyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Caddyfile with the deployed Caddy
        run: |
          image="$(grep -oE '^FROM caddy:[^ ]+@sha256:[0-9a-f]{64}' docker/web.Dockerfile | cut -d' ' -f2)"
          if [ -z "$image" ] || [ "$(wc -l <<< "$image")" -ne 1 ]; then
            echo "::error::expected one digest-pinned FROM caddy:… in docker/web.Dockerfile, got: $image"
            exit 1
          fi
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
