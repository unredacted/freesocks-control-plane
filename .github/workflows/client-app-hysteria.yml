name: Hysteria in real apps
# The released v2rayNG (Android emulator) and v2rayN (Linux) against the node
# image's Xray-core serving FCP's own Hysteria transport
# (docs/client-compatibility.md § "Hysteria in real apps"): each app imports a
# Privacy raw config through its own importer, connects through the `· UDP`
# entry, stops when UDP to the node is dropped, and refuses an entry whose pin
# is wrong or a rogue with another certificate. Fixture data only: the
# certificate pair and password are per run and die with the runner.
on:
  pull_request:
    paths:
      - .github/workflows/client-app-hysteria.yml
      - docker-compose.compat-apps.yml
      - scripts/compat/hysteria-apps/**
      - tests/compat/hysteriaApps.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/client-app-hysteria.yml
      - docker-compose.compat-apps.yml
      - scripts/compat/hysteria-apps/**
      - tests/compat/hysteriaApps.ts
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: client-app-hysteria-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  app:
    name: ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [v2rayNG, v2rayN]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Download the pinned ${{ matrix.app }} release
        id: app
        run: echo "path=$(bun --no-env-file scripts/compat/hysteria-apps/fixture.ts download '${{ matrix.app }}')" >>"$GITHUB_OUTPUT"
      - name: Start the Hysteria node, the rogue and the raw configs
        run: |
          host=127.0.0.1
          if [ '${{ matrix.app }}' = v2rayNG ]; then host=10.0.2.2; fi
          bun --no-env-file scripts/compat/hysteria-apps/fixture.ts up "$host"
          # Every background process writes to a file: one holding the step's
          # output would keep the step (and the emulator step) open.
          mkdir -p test-results/compat/hysteria-apps
          nohup python3 -m http.server 4180 --bind 127.0.0.1 \
            --directory .cache/compat/hysteria-apps/www \
            >test-results/compat/hysteria-apps/www.log 2>&1 </dev/null &
      - name: Let the runner user open /dev/kvm
        if: matrix.app == 'v2rayNG'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: v2rayNG on an Android emulator
        if: matrix.app == 'v2rayNG'
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/compat/hysteria-apps/v2rayng.sh '${{ steps.app.outputs.path }}' http://10.0.2.2:4180
      - name: v2rayN on Linux
        if: matrix.app == 'v2rayN'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick >/dev/null
          bash scripts/compat/hysteria-apps/v2rayn.sh '${{ steps.app.outputs.path }}' http://127.0.0.1:4180
      - if: always()
        run: bun --no-env-file scripts/compat/hysteria-apps/fixture.ts down
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hysteria-${{ matrix.app }}
          path: test-results/compat/hysteria-apps/
          retention-days: 14
