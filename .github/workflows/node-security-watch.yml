# Node security releases reach a PR within hours, not at the next weekly
# Dependabot run.
#
# Dependabot's docker updater runs on Mondays, and GitHub's advisory database has
# no entries for the Node runtime, so a Node security release never triggers a
# Dependabot security update. The Oct 2026 release (22.23.4 / 24.22.1) landed on
# a Wednesday and would have waited five days. Worse, the Node production runs
# came from inside the Convex images, which nothing watched at all: it sat on
# 22.22.2 through three security releases. docker/convex-node.Dockerfile now pins
# that Node like any other base image.
#
# Every few hours this compares each `FROM node:<x.y.z>-<variant>@sha256:…` under
# docker/ with nodejs.org's release index (scripts/node-security-watch.mjs). When
# a newer SECURITY release on the same major has left a pin behind and Docker Hub
# serves the newest release on that major, it re-pins and opens a PR. Ordinary
# releases ride the weekly Dependabot run; a new major is always a person's call.
#
# An end-of-life major gets no security releases, so the flag above would call
# its pins current forever. Within 90 days of a pinned major's end (nodejs/Release
# schedule) this keeps one issue open for it, closed once nothing pins that major.
# Node 22, the Convex images' major, ends 2027-04-30.
name: Node security watch

on:
  schedule:
    # Every three hours. Docker Hub's official node images usually follow a
    # release within hours; a run that finds the image missing tries again.
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: node-security-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Compare every Node pin with nodejs.org's security releases
        id: check
        run: bun scripts/node-security-watch.mjs --apply --summary summary.md --eol eol.json --github-output "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Skip a bump that already has a PR
        id: dedupe
        if: steps.check.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          set -euo pipefail
          # Open, merged or closed: once a PR exists for this exact set of
          # versions a person has it. Closing one unmerged is how to say "not
          # this one"; the next security release opens a fresh PR.
          n="$(gh pr list --state all --head "$BRANCH" --json number --jq 'length')"
          if [ "$n" != "0" ]; then
            echo "a PR for $BRANCH already exists"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # A PR opened with GITHUB_TOKEN starts no pull-request CI, so check here
      # what a Node re-pin can break: the pin tests, and that the new binary
      # loads in both Convex images (the overlay's own RUN step proves it).
      - if: steps.dedupe.outputs.proceed == 'true'
        run: bun install --frozen-lockfile
      - if: steps.dedupe.outputs.proceed == 'true'
        run: bunx vitest run convex/deployPins.test.ts convex/nodeSecurityWatch.test.ts
      - name: Build the Convex images on the new Node
        if: steps.dedupe.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          for img in convex-backend convex-dashboard; do
            ref="$(grep -oE "ghcr\.io/convex/$img:[0-9a-f]{40}@sha256:[0-9a-f]{64}" docker-compose.stack.yml | head -1)"
            docker build -f docker/convex-node.Dockerfile --build-arg CONVEX_IMAGE="$ref" .
          done

      - name: Open the PR
        if: steps.dedupe.outputs.proceed == 'true'
        env:
          BRANCH: ${{ steps.check.outputs.branch }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          set -euo pipefail

          cp summary.md body.md
          cat >> body.md <<EOF

          ### Deploy

          A change to \`docker/convex-node.Dockerfile\` rebuilds the Convex backend and
          dashboard: \`up -d --build --force-recreate backend dashboard deployer\` (the
          backend restarts; no migration runs). The deployer log prints the Node it
          finds (\`node-floor: backend Node v…\`). The compat and edge-connection
          images are test-only.

          > **CI note:** opened by \`GITHUB_TOKEN\`, so pull-request CI did not start.
          > The [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          > ran the pin tests and built both Convex images on this commit. Close and
          > reopen the PR to run full CI.

          _Opened automatically by \`.github/workflows/node-security-watch.yml\`._
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A docker
          git commit -m "$TITLE"
          git push origin "$BRANCH"

          url="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" \
            --body-file body.md --label dependencies --label docker)"
          echo "opened $url"

          # One open Node security PR at a time: an older one is strictly
          # dominated by this one.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"node-security/\")) | select(.headRefName != \"$BRANCH\") | .number" \
            | while read -r n; do
                gh pr close "$n" --delete-branch --comment "Superseded by $url."
                echo "closed superseded PR #$n"
              done

      - name: Keep one issue open per pinned major near its end of life
        if: always() && steps.check.outcome == 'success'
        run: |
          set -euo pipefail
          jq -c '.[]' eol.json | while read -r e; do
            title="$(jq -r .title <<< "$e")"
            jq -r .body <<< "$e" > eol-body.md
            n="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
            if [ -n "$n" ]; then
              gh issue edit "$n" --body-file eol-body.md
            else
              gh issue create --title "$title" --body-file eol-body.md
            fi
          done
          # Close the issues of majors that no pin uses any more.
          gh issue list --state open --search '"reaches end of life on" in:title' --json number,title \
            --jq '.[] | select(.title | test("^Node [0-9]+ reaches end of life on ")) | "\(.number)\t\(.title)"' |
            while IFS=$'\t' read -r n title; do
              if ! jq -e --arg t "$title" 'any(.[]; .title == $t)' eol.json > /dev/null; then
                gh issue close "$n" --comment "No pin is on this major any more. Closing automatically."
              fi
            done
