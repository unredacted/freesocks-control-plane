<!doctype html>
<html lang="en">
  <!--
    Source for public/og.png (the social-preview card, 1200x630). Not part of
    the app build - open this file in a browser (the Vite dev server serves it
    at /scripts/og-card.html, or file:// works too), wait for the fonts, and
    click "Save PNG"; move the download to public/og.png.

    Drawn on a canvas with the bundled brand fonts so the output carries the
    site's real typography without any screenshot tooling. Colors are the dark
    theme's values from globals.css (.dark), and the picture on the right is the
    home page's built-in one (src/client/assets/home-poster.png; an image an
    admin uploads does not change this card). The copy is the hero title + the
    meta description - keep those in sync with index.html / Home.svelte when
    they change.
  -->
  <head>
    <meta charset="UTF-8" />
    <title>og.png source</title>
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-weight: 700;
        src: url('../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-700-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-weight: 800;
        src: url('../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-800-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Next';
        font-weight: 400;
        src: url('../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2')
          format('woff2');
      }
      body {
        margin: 0;
        padding: 24px;
        background: #111;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      canvas {
        max-width: 100%;
        border: 1px solid #444;
      }
    </style>
  </head>
  <body>
    <p><button id="save">Save PNG</button> then move the download to <code>public/og.png</code></p>
    <canvas id="card" width="1200" height="630"></canvas>
    <script>
      // Dark-theme values (globals.css .dark) and the fixed logo green.
      const BG = '#333333';
      const BAND = '#2a2a2a';
      const LINE = '#414141';
      const INK = '#f5f4ef';
      const BODY = '#dcdbd5';
      const MUTED = '#b0afa9';
      const LOGO_GREEN = '#007e4b';

      // The 8-point star on a 24x24 box (the logo mark, BrandMark.svelte).
      const STAR =
        'M12 2l1.53 6.3 5.54-3.37-3.37 5.54L22 12l-6.3 1.53 3.37 5.54-5.54-3.37L12 22l-1.53-6.3-5.54 3.37 3.37-5.54L2 12l6.3-1.53L4.93 4.93l5.54 3.37L12 2Z';

      function logo(ctx, x, y, size) {
        ctx.fillStyle = LOGO_GREEN;
        ctx.beginPath();
        ctx.roundRect(x, y, size, size, size * 0.239);
        ctx.fill();
        // The mark's own transform: translate(174.08) scale(28.16) in 1024 units.
        ctx.save();
        ctx.translate(x + size * 0.17, y + size * 0.17);
        ctx.scale(size * 0.0275, size * 0.0275);
        ctx.fillStyle = '#ffffff';
        ctx.fill(new Path2D(STAR));
        ctx.restore();
      }

      // The home page's built-in picture: 100x144 pixel art stored at 10x, so a
      // width that is a multiple of 100 keeps every pixel square and sharp.
      const POSTER_SRC = '../src/client/assets/home-poster.png';
      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      async function draw() {
        const [posterImg] = await Promise.all([
          loadImage(POSTER_SRC),
          document.fonts.load('700 100px "Schibsted Grotesk"'),
          document.fonts.load('800 50px "Schibsted Grotesk"'),
          document.fonts.load('400 34px "Atkinson Hyperlegible Next"'),
        ]);
        const c = document.getElementById('card');
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, 1200, 630);

        // Footer band: the address and who runs it.
        const BAND_Y = 548;
        ctx.fillStyle = BAND;
        ctx.fillRect(0, BAND_Y, 1200, 630 - BAND_Y);
        ctx.fillStyle = LINE;
        ctx.fillRect(0, BAND_Y, 1200, 1);
        ctx.font = '400 26px "Atkinson Hyperlegible Next"';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = INK;
        ctx.fillText('freesocks.org', 80, BAND_Y + 41);
        ctx.fillStyle = MUTED;
        ctx.textAlign = 'end';
        ctx.fillText('Operated by Unredacted, a US 501(c)(3) nonprofit', 1120, BAND_Y + 41);
        ctx.textAlign = 'start';

        // Brand row.
        const M = 80;
        const LOGO = 60;
        logo(ctx, M, 72, LOGO);
        ctx.fillStyle = INK;
        ctx.font = '800 44px "Schibsted Grotesk"';
        ctx.letterSpacing = '-0.9px';
        ctx.textBaseline = 'middle';
        ctx.fillText('FreeSocks', M + LOGO + 18, 72 + LOGO / 2 + 2);

        // Headline = the hero title, set like the home page's h1.
        ctx.font = '700 98px "Schibsted Grotesk"';
        ctx.letterSpacing = '-2.9px';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('A VPN for', M, 288);
        ctx.fillText('freedom', M, 384);

        // Subline = the meta description.
        ctx.letterSpacing = '0px';
        ctx.fillStyle = BODY;
        ctx.font = '400 31px "Atkinson Hyperlegible Next"';
        ctx.fillText('Free, open & uncensored proxies for users', M, 452);
        ctx.fillText('in heavily-censored regions.', M, 494);

        // The picture, right-aligned to the same margin and vertically centered
        // in the space above the band.
        const W = 300;
        const H = Math.round((W * posterImg.naturalHeight) / posterImg.naturalWidth);
        ctx.drawImage(posterImg, 1200 - M - W, Math.round((BAND_Y - H) / 2), W, H);
      }

      document.getElementById('save').addEventListener('click', () => {
        document.getElementById('card').toBlob((blob) => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'og.png';
          a.click();
        });
      });
      window.ogReady = draw();
    </script>
  </body>
</html>
