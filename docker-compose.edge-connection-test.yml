# Overlay on docker-compose.remnawave-test.yml: the release gate that a MEMBER
# can connect through an edge, with real software end to end
# (scripts/edge-connection-integration.sh, docs/client-compatibility.md).
#
#   - two panel-managed relay nodes: one serving REALITY on its public port
#     (fronted at L4), one serving WebSocket on LOOPBACK behind its own ingress
#     (Caddy in the node's network namespace, TLS for the node's origin
#     hostname), fronted at L7;
#   - a fake L4 edge (a plain TCP forwarder) and a fake L7 edge (a CDN-style
#     WebSocket reverse proxy). The provider APIs are faked inside the test, so
#     FCP "provisions" these two;
#   - a sing-box client that can reach ONLY the edges, and a web page that ONLY
#     the nodes can reach;
#   - the test runner itself (profile `runner`), on the networks FCP needs: its
#     ingress check resolves the origin hostname and dials the node's public
#     address, exactly as in production.
#
# Networks, all local to the test host and routing nowhere:
#   ec-control  panel <-> nodes (management)
#   ec-edge     edges <-> nodes, FCP's checks <-> nodes  (the nodes' "public" addresses)
#   ec-client   the member <-> the edges only              (internal: no route anywhere else)
#   ec-origin   nodes <-> the web page only                (internal)
# Addresses are documentation ranges (RFC 5737, except ec-origin: see there)
# and names are `*.example`: fixtures only, never a real provider, region or
# target.
#
# Nothing is published to the host.
services:
  rw-test-backend:
    networks: [default, ec-control]

  ec-node-reality:
    image: remnawave/node:3.4.1
    container_name: ec-node-reality
    hostname: ec-node-reality
    restart: 'no'
    environment:
      - NODE_PORT=2222
      # The panel's node key (GET /api/keygen), exported by the run script.
      - SECRET_KEY=${EC_NODE_SECRET:?set by scripts/edge-connection-integration.sh}
    cap_add: [NET_ADMIN]
    networks:
      ec-control:
        ipv4_address: 192.0.2.11
      ec-edge:
        ipv4_address: 198.51.100.11
      ec-origin:
        ipv4_address: 11.11.11.11

  ec-node-ws:
    image: remnawave/node:3.4.1
    container_name: ec-node-ws
    hostname: ec-node-ws
    restart: 'no'
    environment:
      - NODE_PORT=2222
      - SECRET_KEY=${EC_NODE_SECRET:?set by scripts/edge-connection-integration.sh}
    cap_add: [NET_ADMIN]
    networks:
      ec-control:
        ipv4_address: 192.0.2.12
      ec-edge:
        ipv4_address: 198.51.100.12
        # The node's origin hostname, as public DNS would answer it.
        aliases: ['${EC_ORIGIN_HOSTNAME:?set by the run script}']
      ec-origin:
        ipv4_address: 11.11.11.12

  # The node role's ingress: shares the WebSocket node's network namespace, so
  # it reaches the loopback inbound and answers on the node's own addresses.
  ec-node-ws-ingress:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: ec-node-ws-ingress
    restart: 'no'
    network_mode: service:ec-node-ws
    environment:
      - EC_ORIGIN_HOSTNAME
      - EC_WS_PATH=${EC_WS_PATH:?set by the run script}
      - EC_WS_PORT=${EC_WS_PORT:?set by the run script}
    volumes:
      - ./docker/edge-connection-test/ingress.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.cache/edge-connection-test/pki:/pki:ro
      - ./.cache/edge-connection-test/logs:/logs
    depends_on: [ec-node-ws]

  # The site the REALITY node borrows its handshake from (the family's target).
  ec-reality-target:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: ec-reality-target
    restart: 'no'
    volumes:
      - ./docker/edge-connection-test/target.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      ec-edge:
        ipv4_address: 198.51.100.31
        aliases: ['${EC_REALITY_TARGET:?set by the run script}']

  # The fake L4 edge. Its client-network address is what the fake provider
  # answers as the load balancer's public IP.
  ec-l4-forwarder:
    image: oven/bun:${FCP_COMPAT_BUN_VERSION:?read from packageManager by the run script}
    container_name: ec-l4-forwarder
    restart: 'no'
    command: [bun, /forwarder.ts]
    volumes:
      - ./docker/edge-connection-test/forwarder.ts:/forwarder.ts:ro
    networks:
      ec-client:
        ipv4_address: 203.0.113.21
      ec-edge:
        ipv4_address: 198.51.100.21

  # The fake L7 edge: every hostname of the fake provider's zone lands here.
  ec-l7-front:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: ec-l7-front
    restart: 'no'
    environment:
      - EC_ORIGIN_HOSTNAME
      - EC_L7_ZONE=${EC_L7_ZONE:?set by the run script}
    volumes:
      - ./docker/edge-connection-test/front.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.cache/edge-connection-test/pki:/pki:ro
      - ./.cache/edge-connection-test/logs:/logs
    networks:
      ec-client:
        ipv4_address: 203.0.113.22
      ec-edge:
        ipv4_address: 198.51.100.22

  # The client network's resolver: the fake provider's zone -> the front.
  ec-dns:
    image: oven/bun:${FCP_COMPAT_BUN_VERSION:?read from packageManager by the run script}
    container_name: ec-dns
    restart: 'no'
    command: [bun, /dns.ts]
    environment:
      - EC_DNS_ZONE=${EC_L7_ZONE:?set by the run script}
      - EC_DNS_ANSWER=203.0.113.22
    volumes:
      - ./docker/edge-connection-test/dns.ts:/dns.ts:ro
    networks:
      ec-client:
        ipv4_address: 203.0.113.53

  ec-origin-page:
    image: oven/bun:${FCP_COMPAT_BUN_VERSION:?read from packageManager by the run script}
    container_name: ec-origin-page
    restart: 'no'
    command: [bun, /origin-page.ts]
    environment:
      - EC_ORIGIN_TOKEN=${EC_ORIGIN_TOKEN:?set by the run script}
    volumes:
      - ./docker/edge-connection-test/origin-page.ts:/origin-page.ts:ro
    networks:
      ec-origin:
        ipv4_address: 11.11.11.200
        aliases: ['${EC_ORIGIN_PAGE:?set by the run script}']

  # The member: the pinned sing-box of the compat suite (fcp-compat-engine),
  # on the client network ONLY. It trusts the per-run test CA, which is what
  # makes the fake front's certificate valid, as a real CDN's is.
  ec-client:
    platform: linux/amd64
    image: fcp-compat-engine:local
    container_name: ec-client
    restart: 'no'
    environment:
      - SSL_CERT_FILE=/pki/ca.pem
    volumes:
      - ./.cache/edge-connection-test/client:/work
      - ./.cache/edge-connection-test/pki/ca.pem:/pki/ca.pem:ro
    networks:
      ec-client:
        ipv4_address: 203.0.113.100

  ec-runner:
    profiles: [runner]
    build:
      context: .
      dockerfile: docker/edge-connection-test/runner.Dockerfile
      args:
        BUN_VERSION: ${FCP_COMPAT_BUN_VERSION:?read from packageManager by the run script}
    image: fcp-edge-connection-runner:local
    working_dir: ${PWD}
    # The repository at the SAME path as on the host, so a bind mount the
    # runner asks the Docker daemon for resolves to the same files. Its own
    # node_modules: the host's are built for the host's platform.
    volumes:
      - ${PWD}:${PWD}
      - ec-runner-node-modules:${PWD}/node_modules
      - ec-runner-bun-cache:/root/.bun/install/cache
      - ${EC_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - EC_ENABLED=1
      - REMNAWAVE_TEST_URL=http://rw-test-proxy:3000
      - REMNAWAVE_TEST_TOKEN
      - EC_ORIGIN_TOKEN
      - EC_ORIGIN_HOSTNAME
      - EC_ORIGIN_PAGE
      - EC_REALITY_TARGET
      - EC_L7_ZONE
      - EC_WS_PATH
      - EC_WS_PORT
      - NODE_EXTRA_CA_CERTS=${PWD}/.cache/edge-connection-test/pki/ca.pem
      - DEV_MOCK_BACKEND=false
      - EC_KEEP
      - CI
      - GITHUB_ACTIONS
    networks: [default, ec-edge]

networks:
  ec-control:
    ipam:
      config:
        - subnet: 192.0.2.0/24
  ec-edge:
    ipam:
      config:
        - subnet: 198.51.100.0/24
  ec-client:
    internal: true
    ipam:
      config:
        - subnet: 203.0.113.0/24
  # NOT a documentation range, on purpose (the one exception above): Xray
  # refuses to proxy to private and reserved addresses ("blocked target ...
  # blackholing connection"), and it counts RFC 5737 as reserved, so a page on
  # one is unreachable THROUGH a node even though the node itself reaches it.
  # The range only has to look public to the node's Xray; the network is
  # internal and routes nowhere (the same choice as docker-compose.remnawave-node-test.yml).
  ec-origin:
    internal: true
    ipam:
      config:
        - subnet: 11.11.11.0/24

# The runner's dependencies survive a run (the run script creates them once):
# `down -v` must not throw away a full install every time.
volumes:
  ec-runner-node-modules:
    external: true
    name: fcp-edge-conn-node-modules
  ec-runner-bun-cache:
    external: true
    name: fcp-edge-conn-bun-cache
